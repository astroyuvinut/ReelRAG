services:
  - type: web
    name: reelrag-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: tiny
      - key: PROXY_URL
        sync: false
      - key: YT_COOKIES_FILE
        value: /etc/secrets/youtube_cookies.txt
      - key: IG_COOKIES_FILE
        value: /etc/secrets/instagram_cookies.txt

  - type: web
    name: reelrag-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://caught-electric-perfume-yield.trycloudflare.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
